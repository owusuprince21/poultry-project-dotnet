services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT: src/PoultryFarm.Api/PoultryFarm.Api.csproj
        ASSEMBLY: PoultryFarm.Api.dll
    image: poultry-farm-api
    ports:
      - "5100:8080"
    env_file:
      - docker.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Apps__FarmBlazorBaseUrl: ${FARM_PUBLIC_URL:-http://${PUBLIC_HOST}:5083}
      Apps__MarketplaceBaseUrl: ${MARKET_PUBLIC_URL:-http://${PUBLIC_HOST}:5084}
      Cors__AllowedOrigins__0: ${FARM_PUBLIC_URL:-http://${PUBLIC_HOST}:5083}
      Cors__AllowedOrigins__1: ${MARKET_PUBLIC_URL:-http://${PUBLIC_HOST}:5084}
      Cors__AllowedOrigins__2: http://${PUBLIC_HOST}:5083
      Cors__AllowedOrigins__3: http://${PUBLIC_HOST}:5084
      Cors__AllowedOrigins__4: http://localhost:5083
      Cors__AllowedOrigins__5: http://localhost:5084
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api-uploads:/app/wwwroot/uploads
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT: src/PoultryFarm.Blazor/PoultryFarm.Blazor.csproj
        ASSEMBLY: PoultryFarm.Blazor.dll
    image: poultry-farm-dashboard
    ports:
      - "5083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Api__BaseUrl: ${API_PUBLIC_URL:-http://${PUBLIC_HOST}:5100}
      Apps__MarketplaceBaseUrl: ${MARKET_PUBLIC_URL:-http://${PUBLIC_HOST}:5084}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${PUBLIC_HOST}:${TAILSCALE_IP:-host-gateway}"
    depends_on:
      - api
    restart: unless-stopped

  marketplace:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT: src/PoultryFarm.Marketplace/PoultryFarm.Marketplace.csproj
        ASSEMBLY: PoultryFarm.Marketplace.dll
    image: poultry-farm-marketplace
    ports:
      - "5084:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Api__BaseUrl: ${API_PUBLIC_URL:-http://${PUBLIC_HOST}:5100}
      Apps__FarmBlazorBaseUrl: ${FARM_PUBLIC_URL:-http://${PUBLIC_HOST}:5083}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${PUBLIC_HOST}:${TAILSCALE_IP:-host-gateway}"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-uploads:
